openapi: 3.0.0
servers:
  - url: "http://localhost:3000"
info:
  title: WASAText API
  description: struttura API del progetto WASAText del corso di Programmazione Web
  version: 1.0.0

paths:

  # login di accesso
  /login:
    post:
      tags: ["login"]
      summary: login dell'utente
      description: accesso dell'utente tramite username con ritorno di un intero; se l'utente non esiste viene creato con ritorno di un intero.
      operationId: doLogin
      requestBody:
        description: dettagli utente.
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
                  example: Giorgia
                  pattern: '^.*?$'
                  minLength: 3
                  maxLength: 16
      responses:
        '200':
          description: utente riconosciuto e loggato con successo
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifier:
                    type: integer
                    example: 125461561
        '201':
          description: utente creato e loggato con successo
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifier:
                    type: integer
                    example: 125461561

  # cambio dello username
  /users/{userId}/username:
    put:
      tags: ["profile"]
      summary: cambio dell'username
      description: viene modificato il nome dell'utente, se unico, e il vecchio viene liberato per il riuso
      operationId: setMyUserName
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
                  example: Giorgia
                  pattern: '^.*?$'
                  minLength: 3
                  maxLength: 16
      responses:
        '200':
          description: username aggiornato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409':
          description: username già esistente

  # cambio della foto profilo 
  /users/{userId}/photo:
    put:
      tags: ["profile"]
      summary: aggiorna la foto profilo utente
      operationId: setMyPhoto
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [photo]
              properties:
                photo:
                  type: string
                  format: binary
      responses:
        '200':
          description: foto aggiornata con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  # lista delle chat 
  /users/{userId}/chats:
    get:
      tags: ["chats"]
      summary: lista delle conversazioni di un utente in ordine cronologico inverso / ricerca per username
      operationId: getMyConversations
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
        - name: username
          in: query
          required: false
          schema:
            type: string
          description: ricerca una conversazione utilizzando un username (opzionale)
      responses:
        '200':
          description: lista conversazioni in ordine cronologico inverso ottenuta con successo (o risultato della ricerca)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatListItem'

  # messaggi di una chat
  /users/{userId}/chats/{chatId}:
    get:
      tags: ["chats"]
      summary: messaggi di una conversazione in ordine cronologico inverso
      operationId: getConversation
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
        - name: chatId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: messaggi di una chat in ordine cronologico inverso ottenuti
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'

  # invio di un messaggio (se la chat non esiste, viene creata)
  /users/{userId}/chats/{chatId}/messages:
    post:
      tags: ["messages"]
      summary: invia un nuovo messaggio in una conversazione
      operationId: sendMessage
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: testo del messaggio
                photo:
                  type: string
                  format: binary
                  description: allegato fotografico opzionale
                replyToMessageId:
                  type: integer
                  description: se presente, messaggio di reply
      responses:
        '200':
          description: messaggio inviato con successo in chat esistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '201':
          description: chat creata e messaggio inviato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

  # inoltro di un messaggio
  /users/{userId}/chats/{chatId}/messages/{messageId}/forward:
    post:
      tags: ["messages"]
      summary: inoltra un messaggio ad una o più destinazioni
      operationId: forwardMessage
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
        - name: chatId
          in: path
          required: true
          schema:
            type: integer
        - name: messageId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targets]
              properties:
                targets:
                  type: array
                  items:
                    type: integer
                  description: lista di chatId a cui inoltrare il messaggio
      responses:
        '200':
          description: messaggio inoltrato con successo

  /users/{userId}/chats/{chatId}/messages/{messageId}/reactions:

    #aggiunge una reazione ad un messaggio
    post:
      tags: ["messages"]
      summary: aggiungi una reazione a un messaggio
      operationId: commentMessage
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
        - name: chatId
          in: path
          required: true
          schema:
            type: integer
        - name: messageId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emoticon]
              properties:
                emoticon:
                  type: string
      responses:
        '201':
          description: reazione aggiunta con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reaction'

    #elimina una reazione ad un messaggio
    delete:
      tags: ["messages"]
      summary: rimuove una reazione da un messaggio
      operationId: uncommentMessage
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
        - name: chatId
          in: path
          required: true
          schema:
            type: integer
        - name: messageId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                emoticon:
                  type: string

      responses:
        '204':
          description: reazione rimossa con successo

  # cancella un messaggio inviato
  /users/{userId}/chats/{chatId}/messages/{messageId}:
    delete:
      tags: ["messages"]
      summary: elimina un messaggio inviato
      operationId: deleteMessage
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
        - name: chatId
          in: path
          required: true
          schema:
            type: integer
        - name: messageId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: messaggio eliminato con successo

  # creazione di un gruppo
  /groups:
    post:
      tags: ["groups"]
      summary: crea un nuovo gruppo con membri iniziali
      operationId: createGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, photo, members]
              properties:
                name:
                  type: string
                photo:
                  type: string
                  format: binary
                members:
                  type: array
                  items:
                    type: integer
                  description: lista di utenti (il creatore è incluso automaticamente)
      responses:
        '201':
          description: gruppo creato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'

  # aggiunge nuovi membri ad un gruppo esistente
  /groups/{groupId}/members:
    post:
      tags: ["groups"]
      summary: aggiunge membri al gruppo 
      operationId: addToGroup
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [members]
              properties:
                members:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          description: membri aggiunti con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '403':
          description: utente non appartenente al gruppo
        '404':
          description: membri da aggiungere non trovati

  # abbandono di un gruppo da parte di un utente
  /groups/{groupId}/leave:
    post:
      tags: ["groups"]
      summary: lascia un gruppo (utente corrente)
      operationId: leaveGroup
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: abbandono effettuato con successo

  # aggiorna il nome di un gruppo
  /groups/{groupId}/name:
    put:
      tags: ["groups"]
      summary: aggiorna il nome del gruppo
      operationId: setGroupName
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        '200':
          description: nome del gruppo aggiornato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '403':
          description: utente non appartenente al gruppo

  # aggiorna la foto del gruppo 
  /groups/{groupId}/photo:
    put:
      tags: ["groups"]
      summary: aggiorna la foto del gruppo
      operationId: setGroupPhoto
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: uri
      responses:
        '200':
          description: foto del gruppo aggiornata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '403':
          description: utente non appartenente al gruppo

components:
  schemas:

    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
          pattern: '^.*?$'
          minLength: 3
          maxLength: 16
        profilePhoto:
          type: string
          format: uri

    Group:
      type: object
      properties:
        id:
          type: integer
        groupname:
          type: string
        groupPhoto:
          type: string
          format: uri
        membersList:
          type: array
          items:
            type: integer

    ChatListItem:
      type: object
      properties:
        id:
          type: integer
        isGroup:
          type: boolean
        photoChat:
          type: string
          format: uri
        lastMessage:
          type: string
          format: date-time
        snippetText:
          type: string
        snippetIcon:
          type: string
          format: uri

    Message:
      type: object
      properties:
        id:
          type: integer
        text:
          type: string
        sentAt:
          type: string
          format: date-time
        sentBy:
          type: integer
        checkmark:
          type: boolean

    Reaction:
      type: object
      properties:
        reactTo:
          type: integer
          description: id del messaggio a cui reagire
        emoticon:
          type: string
          description: emoticon unicode o shortcode